baseURL = 'https://horizon.oss.siradel.com/'
enableRobotsTXT = true
# Category pages (/news/<category>/) are rendered, not the list of categories.
disableKinds = ['taxonomy']
locale = 'en-us'
title = 'Horizon'
enableMissingTranslationPlaceholders = true
refLinksErrorLevel = 'WARNING'
disablePathToLower = true

[build]
    [build.buildStats]
        enable = true
    [[build.cachebusters]]
        source = 'assets/notwatching/hugo_stats\.json'
        target = 'css'

[module]
    # Keep in sync with .hugo-version (the exact version used for deployment).
    [module.hugoVersion]
        extended = true
        min = '0.170.1'
    [[module.mounts]]
        source = 'assets'
        target = 'assets'
    [[module.mounts]]
        disableWatch = true
        source = 'hugo_stats.json'
        target = 'assets/notwatching/hugo_stats.json'

[taxonomies]
    category = "categories"

[permalinks]
    [permalinks.page]
        news = "/news/:year/:month/:slug"
    [permalinks.section]
        news = "/news/all/"
    [permalinks.term]
        categories = "/news/:slug/"

[[cascade]]
  [cascade.params]
    outputs = ["html", "markdown"]
  [cascade.target]
    path = "/docs/**"

[languages]
    [languages.en]
        label = "EN"
        locale = "en-us"
        weight = 1
        [languages.en.params]
            description = "Open-source 3D engine for geospatial data: terrain, imagery, vectors, glTF and 3D Tiles, in the browser (WebAssembly, WebGL 2) or natively on Windows and Linux."

    [languages.fr]
        label = "FR"
        locale = "fr-fr"
        weight = 2
        [languages.fr.params]
            description = "Moteur 3D open source pour les données géospatiales : terrain, imagerie, vecteurs, glTF et 3D Tiles, dans le navigateur (WebAssembly, WebGL 2) ou en natif sous Windows et Linux."

[markup]
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
  [markup.highlight]
    style = "github-dark"
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.extensions.extras.subscript]
        enable = true
    [markup.goldmark.extensions.extras.superscript]
        enable = true

[menus]
    [[menus.main]]
        identifier = "menu__features"
        pageRef = "/features/"
        weight = 10
    [[menus.main]]
        identifier = "menu__news"
        pageRef = "/news/latest/"
        weight = 20
        params = { "language" = "en" }
    [[menus.main]]
        identifier = "menu__getting_started"
        pageRef = "/doc/"
        weight = 30
        params = { "language" = "en" }
    [[menus.main]]
        identifier = "menu__demos"
        pageRef = "/gallery/"
        weight = 40
        params = { "language" = "en" }
    [[menus.doc]]
        name = "Documentation"
        pageRef = "/doc/"
        weight = 10
    [[menus.doc]]
        name = "API Reference"
        pageRef = "/doc/reference/"
        weight = 20
    [[menus.doc]]
        name = "Developer's Guide"
        pageRef = "/doc/dev_guide/"
        weight = 30

[uglyURLs]
    doc = true
    gallery = true

[security]
    allowContent = [".*"]
    [security.exec]
        # Hugo >= 0.165 no longer allows tailwindcss by default; this list replaces the defaults.
        allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
