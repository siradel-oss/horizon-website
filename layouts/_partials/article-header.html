<header
  class="article-header max-w-360 mx-auto flex flex-col lg:flex-row lg:items-stretch gap-3xl"
>
  <div
    class="article-header__text-block relative flex flex-col justify-center gap-lg flex-1 rounded-md bg-inverse-surface-strong px-4xl py-2xl isolate"
  >
    <div class="flex flex-row gap-sm">
      {{ range .GetTerms "categories" }}
        <p
          class="inline-flex self-start bg-surface text-on-surface text-body-xs font-bold px-md py-xs rounded-xxs"
        >
          {{ .Title }}
        </p>
      {{ end }}
    </div>
    <h1 class="text-on-primary font-black text-heading-h3 tracking-tight">
      {{ .Title }}
    </h1>
    <time
      datetime="{{ .Date.Format "2006-01-02" }}"
      class="text-on-surface-muted text-body-xs"
      >{{ .Date.Format "2 January 2006" }}</time
    >
  </div>
  <div
    class="w-full lg:w-147 aspect-587/300 rounded-md overflow-hidden shrink-0"
  >
    <img
      src="{{ (.Resources.Get .Params.thumbnail).RelPermalink }}"
      class="w-full h-full object-cover"
    />
  </div>
</header>
