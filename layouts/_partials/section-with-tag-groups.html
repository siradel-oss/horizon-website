<div>
  <h1 class="text-center mb-3xl">{{ .Title }}</h1>
  <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-2xl">
    {{ range .Params.tag_groups }}
      <article class="tag-group">
        <h3>{{ .name }}</h3>
        <ul>
          {{ range .items }}
            <li class="tag tag--filled">{{ . }}</li>
          {{ end }}
        </ul>
      </article>
    {{ end }}
  </div>
</div>
