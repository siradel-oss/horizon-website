{{ define "head" }}
{{ end }}

{{ define "main" }}
  <main class="pt-10xl grow bg-inverse-surface">
    <!-- ═══════════════════════════════════════════════════════════
       FILTERS — visual tag chips (JS filtering: TODO)
    ═══════════════════════════════════════════════════════════ -->
    <div
      class="
        relative px-3xl bg-inverse-surface-strong
        before:absolute before:inset-x-0 before:top-0 before:h-px before:pointer-events-none before:content-['']
        before:bg-(image:--color-border-gradient-dark)
        after:absolute after:inset-x-0 after:bottom-0 after:h-px after:pointer-events-none after:content-['']
        after:bg-(image:--color-border-gradient-dark)
      "
    >
      <div class="max-w-360 mx-auto py-4xl">
        <ul id="filters-list" class="flex flex-wrap gap-md"></ul>
      </div>
    </div>

    <div class="px-3xl">
      <section class="max-w-360 mx-auto py-4xl">
        <div
          id="demos-grid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3xl"
        ></div>
      </section>
    </div>
  </main>
  <script type="module">
      import { initFilters } from {{ (resources.Get "scripts/gallery-filter.js").RelPermalink }};
      let galleryDemos = {{ hugo.Data.gallery.galleryDemos | jsonify | safeJS }};
      initFilters(galleryDemos);
  </script>
{{ end }}
