<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ (resources.Get "favicon.svg").RelPermalink }}"
    />
    <title>
      {{ if .Page.Title }}
        {{ .Page.Title }} &centerdot;
      {{ end }}{{ .Page.Params.title_suffix }}
    </title>
    {{ with (templates.Defer (dict "key" "global")) }}
      {{ partial "css.html" . }}
    {{ end }}
    {{ if .HasShortcode "tabbed-figure" }}
      <script
        src="{{ (resources.Get "scripts/tabbed-figure.js").RelPermalink }}"
        defer
      ></script>
    {{ end }}
    {{ block "head" . }}{{ end }}
  </head>
  <body
    class="font-sans antialiased text-on-primary flex flex-col min-h-screen"
  >
    {{ partial "header.html" . }}
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
    <script src="{{ (resources.Get "scripts/nav.js").RelPermalink }}"></script>
  </body>
</html>
